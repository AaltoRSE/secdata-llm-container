name: sec-llm-env
channels:
  - nvidia
  - huggingface
  - conda-forge
dependencies:
  - python=3.11
  - pandas
  - scipy
  - scikit-learn
  - xgboost
  - seaborn
  - matplotlib
  - cmdstanpy
  - pymc
  - tabpfn
  - tqdm
  - igraph
  - imageio 
  - polars
  # Jupyter related packages
  - jupyterlab
  - ipywidgets
  - ipykernel
  # LLM related packages
  - nltk
  - datasets
  - accelerate
  - transformers
  - sentence-transformers
  - sentencepiece
  - peft
  - tiktoken
  - huggingface_hub
  - llama-cpp-python
  - llama-index=0.12.30
  - llama-index-readers-file
  - cmake
  # Langchain related packages
  - langchain
  - langchain-community
  - langchain-text-splitters
  - langchain-openai
  - langchain-huggingface
  - langchain-experimental
  - langgraph
  # Unstructured related packages
  - unstructured
  - pdfminer.six
  - opencv-python-headless
  - openpyxl 
  - pdf2image
  - pytesseract
  - pillow-heif
  - faiss-gpu
  - flask
  - python-dotenv
  - pip
  - pip:
      - torch==2.6.0
      - torchvision==0.21.0 
      - torchaudio==2.6.0 
      - --extra-index-url https://download.pytorch.org/whl/cu124
      - vllm==0.8.3
      - bitsandbytes
      - llama-index-llms-huggingface==0.5.0
      - llama-index-embeddings-huggingface==0.5.3
      - unstructured-inference
      - unstructured.pytesseract
      - pymupdf4llm==0.0.21
      - marker-pdf==1.6.1
      - PyMuPDF==1.25.5
      # Jax related packages
      - "jax[cuda12]==0.4.29 -f https://storage.googleapis.com/jax-releases/jax_cuda_releases.html"
      - flax
      - diffrax  
      - dm-haiku
      - dm-sonnet
      - dm-reverb  
variables:
  LLAMA_CUBLAS: 1
  FORCE_CMAKE: 1
  CMAKE_ARGS: "-DLLAMA_CUBLAS=on"