name: sec-llm-env
channels:
  - nvidia
  - huggingface
  - conda-forge
dependencies:
  - python=3.11
  - libstdcxx-ng=15.2.0  # Provides newer libstdc++ for compiled packages like scipy
  - pandas=2.2.3
  - scipy=1.17.0
  - scikit-learn=1.8.0
  - xgboost=3.1.3
  - seaborn=0.13.2
  - matplotlib=3.10.8
  - cmdstanpy=1.3.0
  - pymc=5.25.1
  - tabpfn=2.1.0
  - tqdm=4.67.2
  - igraph=0.10.16
  - imageio=2.37.0
  - polars=1.37.1
  # Jupyter related packages
  - jupyterlab=4.5.3
  - ipywidgets=8.1.8
  - ipykernel=7.1.0
  # LLM related packages
  - nltk=3.9.2
  - datasets=4.5.0
  - accelerate=1.12.0
  - sentence-transformers=5.2.2
  - sentencepiece=0.1.99
  - peft=0.18.1
  - tiktoken=0.12.0
  - huggingface_hub
  - llama-cpp-python=0.2.24
  - llama-index=0.12.30
  - llama-index-readers-file=0.4.11
  - cmake=4.2.3
  # Langchain related packages
  - langchain=0.3.27
  - langchain-community=0.3.31
  - langchain-text-splitters=0.3.11
  - langchain-openai=0.3.35
  - langchain-huggingface=0.1.2
  - langchain-experimental=0.3.4
  - langgraph=1.0.1
  # Unstructured related packages
  - unstructured=0.18.27
  - pdfminer.six=20260107
  - openpyxl=3.1.5
  - pdf2image=1.17.0
  - pytesseract=0.3.13
  - pillow-heif=1.2.0
  - faiss-gpu=1.7.4
  - flask=3.1.2
  - python-dotenv=1.2.1
  - pip
  - pip:
      - label-studio
      - numpy<2.0.0
      - --extra-index-url https://download.pytorch.org/whl/cu129
      - vllm
      - kernels==0.11.5
      - tokenizers>=0.22.0,<=0.23.0
      - transformers==4.57.3
      - bitsandbytes
      - llama-index-llms-huggingface==0.5.0
      - llama-index-embeddings-huggingface==0.5.3
      - pymupdf4llm
      - marker-pdf==1.6.1
      - jax[cuda12]
      - flax
variables:
  LLAMA_CUBLAS: 1
  FORCE_CMAKE: 1
  CMAKE_ARGS: "-DLLAMA_CUBLAS=on"