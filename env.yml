name: sec-llm-env
channels:
  - nvidia
  - huggingface
  - conda-forge
dependencies:
  - python=3.11
  - libstdcxx-ng  # Provides newer libstdc++ for compiled packages like scipy
  - pandas
  - scipy
  - scikit-learn
  - xgboost
  - seaborn
  - matplotlib
  - cmdstanpy
  - pymc
  - tabpfn
  - tqdm
  - igraph
  - imageio 
  - polars
  # Jupyter related packages
  - jupyterlab
  - ipywidgets
  - ipykernel
  # LLM related packages
  - nltk
  - datasets
  - accelerate
  - sentence-transformers
  - sentencepiece
  - peft
  - tiktoken
  - huggingface_hub
  - llama-cpp-python
  - llama-index=0.12.30
  - llama-index-readers-file
  - cmake
  # Langchain related packages
  - langchain
  - langchain-community
  - langchain-text-splitters
  - langchain-openai
  - langchain-huggingface
  - langchain-experimental
  - langgraph
  # Unstructured related packages
  - unstructured
  - pdfminer.six
  - openpyxl 
  - pdf2image
  - pytesseract
  - pillow-heif
  - faiss-gpu
  - flask
  - python-dotenv
  - pip
  - pip:
      - label-studio
      - numpy<2.0.0
      - vllm --extra-index-url https://download.pytorch.org/whl/cu129
      - kernels==0.11.5
      - tokenizers>=0.22.0,<=0.23.0
      - transformers==4.57.3
      - bitsandbytes
      - llama-index-llms-huggingface==0.5.0
      - llama-index-embeddings-huggingface==0.5.3
      - pymupdf4llm
      - marker-pdf==1.6.1
      - jax[cuda12]
      - flax
variables:
  LLAMA_CUBLAS: 1
  FORCE_CMAKE: 1
  CMAKE_ARGS: "-DLLAMA_CUBLAS=on"